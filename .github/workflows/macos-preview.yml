name: Apple Silicon Mac preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare pinned tools and source dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          python3 -m pip install cmake==3.31.6
          rustup toolchain install 1.90.0 --profile minimal
          mkdir -p .build
          curl --fail --location --retry 3 -o .build/dependencies.zip https://github.com/Zaliba1/hunter-island-preservation/releases/download/v0.2.0-preview.2/HunterIsland-SourceDependencies-0.2.0-preview.2.zip
          echo 'b232e533bea7ce266cbd8751ac83f19a496c4c8f87d02b411e887f1244cc4788  .build/dependencies.zip' | shasum -a 256 -c -
          python3 tools/prepare_offline_sources.py .build/dependencies.zip
          curl --fail --location --retry 3 -o .build/sha2-0.10.6.crate https://static.crates.io/crates/sha2/sha2-0.10.6.crate
          python3 tools/add_locked_crate.py .build/sha2-0.10.6.crate
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/macos/target
          key: macos-arm64-rust190-v1-${{ hashFiles('emulator/Cargo.lock', 'emulator/Cargo.toml', 'emulator/src/**') }}
          restore-keys: macos-arm64-rust190-v1-
      - name: Build and test the native app
        shell: bash
        run: bash tools/build-macos.sh
      - name: Retain native build cache
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .build/macos/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload test app and matching sources
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HunterIsland-macOS-arm64-preview
          path: |
            dist/macos/*.zip
            dist/macos/*.json
            dist/macos/*.txt
            dist/macos/README.md
          retention-days: 14
      - name: Upload diagnostics without game data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-build-checks
          path: |
            .build/macos/*.log
            .build/macos/launcher.png
          if-no-files-found: ignore
          retention-days: 7
